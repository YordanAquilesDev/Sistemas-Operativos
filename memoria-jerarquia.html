<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerarquía de Memoria</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        max-width: 1100px;
        width: 90%;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Jerarquía de Memoria del Computador</h1>
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Jerarquia-de-memoria-del-computador.svg/1280px-Jerarquia-de-memoria-del-computador.svg.png"
        alt="Jerarquía de memoria del computador"
      />
    </div>
  </body>
</html>
